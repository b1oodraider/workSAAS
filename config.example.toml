# Скопируйте в config.toml и поправьте под себя. Секреты — в .env, не здесь.
# Любой параметр можно переопределить переменной окружения: WS_<СЕКЦИЯ>__<КЛЮЧ>.

database_url = "sqlite:///data/worksaas.db"
output_language = "русский"
# Лимит расходов на LLM на одного пользователя в месяц, $. 0 = без лимита.
default_monthly_budget_usd = 10.0
# Прокси для провайдеров/источников с use_proxy = true. HTTP(S)-прокси; про SOCKS — см. README.
# proxy_url = "http://user:pass@host:port"

# ---------------------------------------------------------------------------
# LLM-провайдеры. Имя секции — произвольное, на него ссылаются маршруты.
# ---------------------------------------------------------------------------
[llm.providers.anthropic]
type = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"
use_proxy = false
# Автоматический повтор на другой модели, если модель отказалась отвечать.
refusal_fallback = true

# --- Оплата из России (см. reports/Оплата LLM из России 2026.md) -----------------
# ВНИМАНИЕ: адреса и способы авторизации ниже взяты из документации/выдержек на 2026-09
# и НЕ проверялись запросом — сверьте с сайтом провайдера перед оплатой.

# Claude через реселлера с оплатой в рублях (родной формат Anthropic, ключ как Bearer).
# [llm.providers.aitunnel]
# type = "anthropic"
# base_url = "https://api.aitunnel.ru"
# api_key_env = "AITUNNEL_API_KEY"
# auth_scheme = "bearer"
# price_multiplier = 2.4        # наценка к официальной цене — чтобы бюджет считался честно
#
# [llm.providers.proxyapi]
# type = "anthropic"
# base_url = "https://api.proxyapi.ru/anthropic"
# api_key_env = "PROXYAPI_API_KEY"
# auth_scheme = "bearer"
# price_multiplier = 3.6

# Cloud.ru Foundation Models (GigaChat, Qwen, GLM) — OpenAI-совместимый API, карта РФ.
# [llm.providers.cloudru]
# type = "openai_compat"
# base_url = "https://foundation-models.api.cloud.ru/v1"
# api_key_env = "CLOUDRU_API_KEY"
# json_mode = "json_object"

# Yandex AI Studio — OpenAI-совместимый API; модель указывается как "gpt://<folder_id>/<модель>/latest".
# Какой заголовок авторизации нужен для вашего ключа (Bearer или Api-Key) — проверьте в документации.
# [llm.providers.yandex]
# type = "openai_compat"
# base_url = "https://llm.api.cloud.yandex.net/v1"
# api_key_env = "YANDEX_API_KEY"
# auth_scheme = "Api-Key"
# json_mode = "json_object"

# Любой OpenAI-совместимый сервер: DeepSeek, OpenRouter (из РФ закрыт с 2026-06), Ollama, LM Studio, vLLM...
# [llm.providers.deepseek]
# type = "openai_compat"
# base_url = "https://api.deepseek.com/v1"
# api_key_env = "DEEPSEEK_API_KEY"
# json_mode = "json_object"

# Локальная модель через Ollama (на ноутбуке без GPU — медленно, 7B-модели дают заметно
# худшее качество; разумно разве что для оценки вакансий/префильтра).
# [llm.providers.local]
# type = "openai_compat"
# base_url = "http://localhost:11434/v1"
# json_mode = "json_object"
# timeout_s = 600

[llm.providers.fake]
type = "fake"   # офлайн-заглушка для разработки интерфейса

# ---------------------------------------------------------------------------
# Маршруты: какая модель обслуживает какую фичу. "default" — для всех остальных.
# effort: low | medium | high | xhigh | max (глубина размышлений; влияет на цену).
# ---------------------------------------------------------------------------
[llm.routes.default]
provider = "anthropic"
model = "claude-opus-5-5"
effort = "medium"

[llm.routes.match]            # массовая оценка вакансий — самая частая операция
provider = "anthropic"
model = "claude-opus-5-5"
effort = "low"

[llm.routes.resume_profile]
provider = "anthropic"
model = "claude-opus-5-5"
effort = "low"

[llm.routes.vacancy_review]   # короткий вход, задача ближе к извлечению фактов
provider = "anthropic"
model = "claude-opus-5-5"
effort = "low"

[llm.routes.follow_up]        # короткие письма
provider = "anthropic"
model = "claude-opus-5-5"
effort = "low"

[llm.routes.recruiter_reply]
provider = "anthropic"
model = "claude-opus-5-5"
effort = "low"

# [llm.routes.cover_letter]
# provider = "anthropic"
# model = "claude-opus-5-5"
# effort = "high"

# Резервные провайдеры: если основной недоступен (сеть, лимиты, упал реселлер),
# gateway по очереди пробует fallbacks. Пример для всех фич по умолчанию:
# [llm.routes.default]
# provider = "aitunnel"
# model = "claude-opus-5-5"
# effort = "medium"
# fallbacks = [
#   { provider = "cloudru", model = "<id модели GigaChat из консоли Cloud.ru>" },
# ]

# Цены для учёта бюджета ($ за 1M токенов). Для Claude уже заданы в app/llm/pricing.py;
# для других моделей добавьте сами, иначе их стоимость считается нулевой.
# [llm.prices."deepseek-chat"]
# input = 0.27
# output = 1.10

# ---------------------------------------------------------------------------
# Источники вакансий
# ---------------------------------------------------------------------------
# Источник без секции в этом файле использует настройки по умолчанию
# (hh, habr, trudvsem, remotive, remoteok, manual — включены; superjob, telegram, rss — нет).

[sources.hh]
enabled = true
use_proxy = false
[sources.hh.options]
# auto — сначала API, при отказе (401/403) — разбор сайта; api — только API; web — только сайт
mode = "auto"
# Для режима сайта: auto — обычный HTTP, при капче переключиться на браузер (нужен
# pip install -e ".[browser]" && playwright install chromium); http; browser
fetcher = "auto"
min_interval = 2.5                          # секунд между запросами к hh.ru — не уменьшайте сильно
area = 113                                  # 113 Россия, 1 Москва, 2 СПб
user_agent = "worksaas/0.1 (you@example.com)"  # для API: hh.ru просит указывать контакт
# access_token = ""                         # если есть OAuth-токен приложения hh.ru

[sources.habr]                              # Хабр Карьера
enabled = true

[sources.superjob]                          # нужен бесплатный ключ: https://api.superjob.ru
enabled = false
[sources.superjob.options]
api_key_env = "SUPERJOB_API_KEY"            # имя переменной в .env
# town = 4                                  # 4 = Москва

[sources.trudvsem]                          # «Работа России», открытый API без ключа
enabled = true
[sources.trudvsem.options]
# region = "7700000000000"                  # код региона; пусто — вся Россия

[sources.telegram]                          # публичные каналы с вакансиями (через t.me/s/…)
enabled = false
[sources.telegram.options]
channels = [
  # "имя_канала_без_собаки",
]
pages = 2

[sources.remotive]                          # удалёнка за рубежом
enabled = true

[sources.remoteok]
enabled = true

[sources.rss]
enabled = false
[sources.rss.options]
feeds = [
  # "https://example.com/jobs.rss",
]
match_all_words = false

[sources.manual]
enabled = true

# ---------------------------------------------------------------------------
[matching]
top_n = 15            # сколько лучших по префильтру вакансий за запуск оценивает LLM
prefilter_min = 10.0  # ниже этого балла (0..100) в LLM не отправляем
fetch_limit = 50      # вакансий на один запрос в одном источнике

[jobs]
concurrency = 2           # параллельных LLM-задач
run_in_web_process = true # false — запускайте `worksaas worker` отдельно
scheduler_interval_s = 60
